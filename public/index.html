<!DOCTYPE html>
<html lang="en" class="bg-black text-shadow min-h-screen">

<head>
  <meta charset="utf-8" />
  <link rel="icon" src="%PUBLIC_URL%/cursor.webp" />
  <meta name="viewport"
    content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Eugene Krokhmal - Front-end Developer" />
  <link rel="apple-touch-icon" src="%PUBLIC_URL%/cursor.webp" />
  <link rel="stylesheet" type="text/css" charset="UTF-8"
    href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.6.0/slick.min.css" />
  <link rel="stylesheet" type="text/css"
    href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.6.0/slick-theme.min.css" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <title>Eugene Krokhmal Portfolio</title>
</head>

<body class="min-h-screen h-full">
  <div id="root" class="flex flex-col h-full"></div>
</body>

<img width="32" style="display: none" src="%PUBLIC_URL%/cursor.webp" class="hidden md:block custom-cursor"
  alt="cursor'">

<script async>
  const customCursor = document.querySelector('.custom-cursor');

  document.addEventListener('mousemove', (e) => {
    customCursor.style.display = 'block';
    customCursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
  });
</script>

</html>
